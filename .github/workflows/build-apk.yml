# VoiceWorld AI — build signed release APK on GitHub Actions (free tier).
#
# Runs on every push to main and on manual dispatch (Actions tab -> Run workflow).
# The APK is uploaded as a build artifact (download from the Actions run page).
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64   — base64 of voiceworld-release.keystore (kept locally in keystore/, NEVER committed)
#   KEYSTORE_PASSWORD — keystore storePassword
#   KEY_PASSWORD      — keystore keyPassword
#   KEY_ALIAS         — keystore keyAlias ("voiceworld")
#
# The keystore file and its passwords are NEVER committed (see .gitignore);
# they are recreated from secrets on each run only.

name: Build VoiceWorld AI release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        # The ubuntu runner already ships an Android SDK (ANDROID_HOME). Install
        # exactly the packages the build needs; do NOT use
        # android-actions/setup-android — its default `tools` package no longer
        # exists in the SDK repository and fails the run.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JS dependencies
        run: cd android-app && npm ci

      - name: Restore release keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android-app/android/app/voiceworld-release.keystore
          cat > android-app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=voiceworld-release.keystore
          EOF
        # NOTE: keytool stores a PKCS12 private key under the STORE password
        # (a separate -keypass is ignored), so keyPassword must equal
        # storePassword here or signing fails with "Given final block not
        # properly padded". KEY_PASSWORD secret is intentionally unused.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}

      - name: Prepare web assets (copy final-deploy, open user app directly)
        run: bash android-app/scripts/prepare-www.sh

      - name: Sync Capacitor
        run: cd android-app && npx cap sync android

      - name: Build signed release APK
        run: cd android-app/android && chmod +x gradlew && ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voiceworld-apk
          path: android-app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
